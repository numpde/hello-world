[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openapi-mcp-bridge-example"
version = "0.1.0"
description = "A bounded OpenAPI-to-MCP example, using FastMCP as a reviewed dependency"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.8",
    "httpx2==2.16.0",
]

[project.scripts]
openapi-mcp-bridge = "openapi_mcp_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_mcp_bridge"]
